<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 180" width="100%" height="100%">
  <rect width="350" height="180" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="20" y1="100" x2="330" y2="100" stroke="#334155" stroke-width="4"/>
  <polygon points="330,95 340,100 330,105" fill="#334155"/>
  
      <line x1="40" y1="85" x2="40" y2="115" stroke="#334155" stroke-width="3"/>
      <text x="40" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">4</text>
    
      <line x1="85" y1="85" x2="85" y2="115" stroke="#334155" stroke-width="3"/>
      <text x="85" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">5</text>
    
      <line x1="130" y1="85" x2="130" y2="115" stroke="#334155" stroke-width="3"/>
      <text x="130" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">6</text>
    
      <line x1="175" y1="85" x2="175" y2="115" stroke="#334155" stroke-width="3"/>
      <text x="175" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">7</text>
    
      <line x1="220" y1="85" x2="220" y2="115" stroke="#334155" stroke-width="3"/>
      <text x="220" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">8</text>
    
      <line x1="265" y1="85" x2="265" y2="115" stroke="#334155" stroke-width="3"/>
      <text x="265" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">9</text>
    
      <line x1="310" y1="85" x2="310" y2="115" stroke="#334155" stroke-width="3"/>
      <text x="310" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">10</text>
    
  <!-- Hop arc from 4 to 10 -->
  <path d="M 40,85 Q 175,10 310,85" fill="none" stroke="#e11d48" stroke-width="4" stroke-dasharray="6,4"/>
  <text x="175" y="35" font-family="'Comic Sans MS', sans-serif" font-size="20" font-weight="bold" fill="#e11d48" text-anchor="middle">+ 6 hops</text>
