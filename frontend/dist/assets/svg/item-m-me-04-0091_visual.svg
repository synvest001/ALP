    <ellipse cx="-16" cy="-10" rx="6" ry="8" fill="#78350f"/><circle cx="-18" cy="-12" r="2" fill="#ffffff"/>
    <ellipse cx="16" cy="-10" rx="6" ry="8" fill="#78350f"/><circle cx="14" cy="-12" r="2" fill="#ffffff"/>
